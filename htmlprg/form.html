<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration form</title>
</head>
<body style="text-align: center;">
    <style>
        .heading{
            color: white;
            background-color: rgb(30, 9, 112);
            font-family: Georgia, 'Times New Roman', Times, serif;
            padding-bottom: 36px;
            padding-top: 36px;
            text-align: center;
            font-weight: 200;
            margin-left:none;
        }
    </style>
    <h4 class="heading "> REGISTRATION FORM</h4>

    <form>
        <label >Full Name:</label>
        <input type="text"  placeholder=" enter your name"><br><br>
        <label >Age</label>
        <input type="text"  placeholder=" enter your age"><br><br>
        <label>Email:</label>
        <input type="email" placeholder=" enter your email"><br><br>
        <label>Address:</label>
        <textarea placeholder="enter your address"></textarea> <br><br>    
        <label for="place">Place:</label>
        
        <select >
           <option>Ernakulam</option>
           <option> palakkad</option>
           <option>kasargod</option>
           <option>Thiruvanathapuram</option>
           <option>kannur</option>
           <option>Kozhikode</option>
           <option>malapuram</option>
           
           <br><br>
        </select><br><br>
        <label>Gender:</label>

        <label for="male">male</label>
        <input type="radio" name="gender" value="male">
        <label for="female">female</label>
        <input type="radio" name="gender" value="female">
        <label for="others">others</label>
        <input type="radio" name="gender" value="others"><br><br>
        <label for="password">Password:</label>
        <input type="password">
        
       
    </form>
    
</body>
</html>
