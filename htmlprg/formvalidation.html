<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="color.css">
</head>
<body>
    <form onsubmit="return validateForm()" novalidate>
    <h2>Registration Form</h2>
    <label for="name">Name:</label>
    <input type="text" id="name" name="name"  placeholder="enter your name" required><br><br>
    
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="enter email" required><br><br>
    
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" placeholder="enter password " required><br><br>
    
    <label for="confirmpass">Confirm Password:</label>
    <input type="password" id="confirmpass" name="confirmpass" placeholder="enter password"><br><br>
  
    <label for="phone">Contact number:</label>
    <input type="number" id="phone"  placeholder="enter your contact number" required><br><br>

    <button type="submit">submit</button>
    </form>
    


   <script>
     function validateForm(){
        let name=document.getElementById("name").value.trim();
        let email=document.getElementById("email").value.trim();
        let password=document.getElementById("password").value.trim();
        let confirmPass=document.getElementById("confirmpass").value.trim();
        let contact=document.getElementById("phone").value.trim();
        

        if (name===""){
            alert("Name is required");
            return false;
        }
        if(name.length<3){
            alert("name must be atleast 3 characters");
        }
        if(email===""){
            alert("enter your email");
            return false;
        }
        if (!email.includes("@")|| !email.includes(".")){
            alert("please enter a valid email");
            return false;
        }
        if (password===""){
            alert("please enter the password");
            return false;
        }
        if( password.length<6){
            alert("password must contain atleast 6 character");
            return false;
        }
        if (!/[@$%&]/.test(password)){
            alert("password must contain any special characters like #,$,@,&,%");
            return false;
        }
        if (confirmPass===""){
            alert("enter your confirm password");
            return false;
        }
        if(confirmPass!==password){
            alert("check the confirm password");
            return false;
        }
        if (contact===""){
            alert("enter your contact number");
            return false;
        }
        if(contact.length<10){
            alert("contact number must be atleast 10 digits");
            return false;
        }
        alert("form submission successfull");
        return true;
     }
    </script>
</body>
</html>
