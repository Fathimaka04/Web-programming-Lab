<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>variables</title>
</head>
<body>
    <script>
        let variable1 = 3;
        console.log(variable1);


        let calculation = 2+2;// variable can  bet changed if we use let
        console.log(calculation);
        console.log(calculation+2);
        const result = calculation+3;
        console.log(result);
        let message='hii';
        console.log(message);
        variable1=10;
        console.log(variable1);
        const variable2 = 9; // no change in variable next time,by default
        var variable4=7// like let but not use in new js
        console.log(typeof message);

    </script>
    
</body>
</html>
