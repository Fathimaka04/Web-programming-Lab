<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }

        #resultBox {
            width: 200px;
            height: 40px;
            font-size: 20px;
            text-align: right;
            padding-right: 10px;
            margin-bottom: 20px;
        }

        button {
            width: 50px;
            height: 40px;
            font-size: 18px;
            margin: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #330707;
            color:aliceblue;
        }
    </style>
</head>
<body>

    <input id="resultBox" type="text" readonly><br><br>

  <div>

   <p> 
    <button onclick="updateCalculation('1')">1</button>
    <button onclick="updateCalculation('2')">2</button>
    <button onclick="updateCalculation('3')">3</button>
   </p>

   <p> 
    <button onclick="updateCalculation('4')">4</button>
    <button onclick="updateCalculation('5')">5</button>
    <button onclick="updateCalculation('6')">6</button>
   </p>

   <p>
    <button onclick="updateCalculation('7')">7</button>
    <button onclick="updateCalculation('8')">8</button>
    <button onclick="updateCalculation('9')">9</button>
   </p>

   <p>
    <button onclick="updateCalculation('0')">0</button>
    <button onclick="updateCalculation('+')">+</button>
    <button onclick="updateCalculation('-')">-</button>
   </p>

   <p>
    <button onclick="updateCalculation('*')">*</button>
    <button onclick="updateCalculation('/')">/</button>

    <button onclick="
        calculation = eval(calculation);
        document.getElementById('resultBox').value = calculation;
    ">
      =
    </button>

    <button onclick="
      calculation='';
      document.getElementById('resultBox').value='';
    ">
      clear
    </button>
   </p>

    <script>
        let calculation='';

        function updateCalculation(value){
            calculation += value;
            document.getElementById("resultBox").value = calculation;
        }
    </script>

  </div>  
</body>
</html>
