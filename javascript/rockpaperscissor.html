<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rockpaperscissor</title>
</head>
<body style="background-color: black;text-align: center;">
    <p>Rock Paper Scissor</p>
    <style>
        button{
            width:50px;
            border-radius: 10px;
            border: none;
            height: 20px;
            vertical-align: baseline;
        
    }
    </style>
    <button onclick="
    playGame('rock');
    ">rock</button>


    <button
    onclick="  
    playGame('paper');">paper</button>


    <button
     onclick="
      playGame('scissor');
     ">scissor</button>
     <button onclick="
     score.wins=0;
     score.losses=0;
     score.ties=0;
     ">Reset score</button>
    
 <script>

       const score={
        wins:0,
        losses:0,
        ties:0

       };
        function playGame(playerMove){
        const computerMove=pickComputerMove();
         let result = '';
    if(playerMove==='scissor'){
        if (computerMove === 'rock')
        {
            result = ' you lose';
        }
        else if (computerMove === 'paper')
        { result = 'you win';}
        
        else { result = ' you tie';}
       
            }
      if(playerMove==='rock'){
        if (computerMove === 'rock')
        {
            result = ' you tie';
        }
        else if (computerMove === 'paper')
        { result = 'you win';}
        
        else { result = ' you lose';}
       
            }
      if(playerMove==='paper'){
        if (computerMove === 'rock')
        {
            result = ' you lose';
        }
        else if (computerMove === 'paper')
        { result = 'you tie';}
        
        else { result = ' you win';}
       
            }


            if (result===' you win'){
                score.wins=score.wins+1;
            }
            else if(result==='you lose'){
                score.losses+=1;

            }
            else if( result==='you tie'){
                score.ties+=1;
            }
            
            alert(`you picked ${playerMove} and computer picked ${computerMove} you ${result}
win:${score.wins} loses:${score.losses} ties:${score.ties}`);
            }
        
        function  pickComputerMove(){
            const randomNumber = Math.random();
         let computerMove = '';
        if (randomNumber >=0 && randomNumber < 1/3)
        { computerMove = 'rock';}
        else if ( randomNumber >=1/3 && randomNumber < 2/3 )
        { computerMove = 'paper';}
        else { computerMove ='scissor';}
        return  computerMove;
     }
    
        
    </script>
</body>
</html>
